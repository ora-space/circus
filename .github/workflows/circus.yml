# The circus bot: the only writer of labels and assignees. See scripts/README.md.
name: circus

on:
  issues:
    types: [opened, closed, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CIRCUS_APP_ID }}
          private-key: ${{ secrets.CIRCUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - run: node scripts/cli.ts bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
